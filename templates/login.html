<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <title>Rut Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body class="login-body">
  <form method="post" class="login">
    <div class="login-gem">◈</div>
    <h1><em>Rut</em> Finance</h1>
    {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="toast err"><span class="toast-msg">{{ m }}</span></div>{% endfor %}{% endwith %}
    <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN" autofocus required>
    <button class="btn wide">Open</button>
  </form>
</body>
</html>
