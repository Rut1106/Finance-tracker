services:
  - type: web
    name: rut-finance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    envVars:
      - key: GOOGLE_CREDENTIALS
        sync: false
      - key: APP_PIN
        sync: false
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SPLITWISE_TOKEN
        sync: false
